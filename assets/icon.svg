<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>FORGE</title>
  <defs>
    <radialGradient id="rubber" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#2a2522"/>
      <stop offset="1" stop-color="#121110"/>
    </radialGradient>
    <radialGradient id="plate" cx="38%" cy="30%" r="82%">
      <stop offset="0" stop-color="#ea4a40"/>
      <stop offset=".55" stop-color="#d6322a"/>
      <stop offset="1" stop-color="#a3221b"/>
